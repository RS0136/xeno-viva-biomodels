[project]
name = "xeno-biomodels"
version = "0.1.0"
description = "A BioModels SBML organism (run through viva-biomodels / Vivarium 2.0) and an organism orthogonal to it, with the measure of orthogonality"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# The simulator stack (process-bigraph, viva-tellurium, viva-copasi, viva-simbio, ...) is the one that
# viva-biomodels locks. It is installed from env/viva-biomodels.lock.txt, an export of the uv.lock of
# third_party/viva-biomodels, and not resolved again here: see README.md, "Install".
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "pyyaml",
    "process-bigraph>=1.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
xvb = "xeno_biomodels.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xeno_biomodels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
